[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm"]

[phases.install]
cmds = ["npx -y pnpm@10.33.2 install --frozen-lockfile"]

[phases.build]
cmds = ["npx -y pnpm@10.33.2 --filter @workspace/db run build 2>/dev/null || true", "npx -y pnpm@10.33.2 --filter @workspace/api-server run build"]

[start]
cmd = "npx -y pnpm@10.33.2 --filter @workspace/api-server run start"
