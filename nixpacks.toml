[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm"]

[phases.install]
cmds = ["corepack prepare pnpm@10.33.2 --activate", "corepack pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["corepack pnpm --filter @workspace/db run build 2>/dev/null || true", "corepack pnpm --filter @workspace/api-server run build"]

[start]
cmd = "corepack pnpm --filter @workspace/api-server run start"
